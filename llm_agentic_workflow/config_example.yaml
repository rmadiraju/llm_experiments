workflow:
  name: "Multi-Agent Document Processor"
  description: "A workflow that processes documents using multiple specialized agents"
  
  # Global settings
  settings:
    max_iterations: 10
    timeout: 300
    
  # LLM configurations
  llm_configs:
    openai_gpt4:
      provider: "openai"
      model: "gpt-4"
      method: "chat"
      temperature: 0.1
      max_tokens: 4000
      api_key_env: "OPENAI_API_KEY"
      
    anthropic_claude:
      provider: "anthropic"
      model: "claude-3-sonnet-20240229"
      method: "chat"
      temperature: 0.2
      max_tokens: 4000
      api_key_env: "ANTHROPIC_API_KEY"
      
    bedrock_claude:
      provider: "bedrock"
      model: "anthropic.claude-3-sonnet-20240229-v1:0"
      method: "generate"
      temperature: 0.1
      max_tokens: 4000
      region: "us-east-1"
      
  # Tool definitions
  tools:
    web_search:
      name: "web_search"
      description: "Search the web for current information"
      input_schema:
        query:
          type: "string"
          description: "Search query"
      output_schema:
        results:
          type: "array"
          description: "Search results"
          
    file_reader:
      name: "file_reader"
      description: "Read content from files"
      input_schema:
        file_path:
          type: "string"
          description: "Path to the file to read"
      output_schema:
        content:
          type: "string"
          description: "File content"
          
    calculator:
      name: "calculator"
      description: "Perform mathematical calculations"
      input_schema:
        expression:
          type: "string"
          description: "Mathematical expression to evaluate"
      output_schema:
        result:
          type: "number"
          description: "Calculation result"
          
  # Agent definitions
  agents:
    document_analyzer:
      type: "react_agent"
      llm_config: "openai_gpt4"
      system_prompt: |
        You are a document analysis expert. Your role is to analyze documents and extract key information.
        Always be thorough and accurate in your analysis.
      tools: ["file_reader"]
      next: "content_summarizer"
      
    content_summarizer:
      type: "react_agent"
      llm_config: "anthropic_claude"
      system_prompt: |
        You are a content summarization expert. Create concise, accurate summaries of the provided content.
        Focus on the most important points and maintain clarity.
      tools: []
      next: "fact_checker"
      
    fact_checker:
      type: "react_agent"
      llm_config: "openai_gpt4"
      system_prompt: |
        You are a fact-checking expert. Verify the accuracy of information and identify any inconsistencies.
        Use web search when needed to verify facts.
      tools: ["web_search"]
      next: "report_generator"
      
    report_generator:
      type: "react_agent"
      llm_config: "bedrock_claude"
      system_prompt: |
        You are a report generation expert. Create comprehensive, well-structured reports based on the analyzed information.
        Ensure the report is clear, professional, and actionable.
      tools: ["calculator"]
      next: null  # End of workflow
      
  # Conditional edges
  conditional_edges:
    quality_check:
      from: "fact_checker"
      to: "report_generator"
      condition:
        type: "content_based"
        function: "check_quality_threshold"
        parameters:
          min_confidence: 0.8
          required_fields: ["accuracy_score", "completeness_score"]
          
    loop_back:
      from: "report_generator"
      to: "document_analyzer"
      condition:
        type: "custom_function"
        function: "needs_revision"
        parameters:
          max_iterations: 3
          
  # Custom functions for conditions
  custom_functions:
    check_quality_threshold:
      description: "Check if the quality score meets the threshold"
      parameters:
        min_confidence: "float"
        required_fields: "list"
        
    needs_revision:
      description: "Determine if the report needs revision"
      parameters:
        max_iterations: "int" 